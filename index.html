<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>课程表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: #f8f8f8;
      font-family: "PingFang SC", "Inter", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── week strip ── */
    .week-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      font-size: 11px; font-weight: 500;
      border: 1px solid #e0e0e0; color: #555;
      background: transparent; cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .week-btn:hover  { background: #f0f0f0; }
    .week-btn.active { background: #111; color: #fff; border-color: #111; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* ── timetable ── */
    #scroll-wrap {
      flex: 1; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    #tt {
      display: grid;
      /* col 0 = time label, cols 1-7 = Mon-Sun */
      grid-template-columns: 42px repeat(7, minmax(72px, 1fr));
      /* row 0 = day header, rows 1-13 = periods */
      grid-template-rows: 48px repeat(13, 52px);
      min-width: 560px;
    }

    /* sticky day headers (row 0, vertical scroll) */
    .tt-day-hd {
      position: sticky; top: 0; z-index: 20;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
    }
    /* sticky time labels (col 0, horizontal scroll) */
    .tt-time {
      position: sticky; left: 0; z-index: 10;
      background: #f8f8f8;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-right: 1px solid #e8e8e8;
    }
    /* corner */
    .tt-corner {
      position: sticky; top: 0; left: 0; z-index: 30;
      background: #f8f8f8;
      border-right: 1px solid #e8e8e8;
      border-bottom: 1px solid #e8e8e8;
    }
    /* background cells */
    .tt-cell {
      border-right: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
    }
    /* section separators (before 上午/下午/晚上) */
    .tt-cell.sec-break, .tt-time.sec-break { border-top: 2px solid #e0e0e0; }

    /* course block */
    .course-blk {
      margin: 2px;
      border-radius: 8px;
      padding: 5px 6px;
      overflow: hidden;
      display: flex; flex-direction: column;
      cursor: default;
      border-left: 3px solid transparent;
    }
    .course-blk .cn { font-size: 11px; font-weight: 600; line-height: 1.3; }
    .course-blk .cr { font-size: 9px; opacity: .65; margin-top: 2px; line-height: 1.3; }
    .course-blk .tc { font-size: 9px; opacity: .5; margin-top: 1px; line-height: 1.3; }
    .course-blk .pg { font-size: 8px; opacity: .55; margin-top: auto; padding-top: 2px; }

    /* today column highlight */
    .today-col { background: #f0f5ff !important; }
    .tt-day-hd.today-hd { background: #111; }
    .tt-day-hd.today-hd .hd-day  { color: #fff; }
    .tt-day-hd.today-hd .hd-date { color: rgba(255,255,255,.65); }

    /* 全周 banner */
    #allweek-bar {
      padding: 6px 12px; background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: none; gap: 6px; flex-wrap: wrap;
    }
    .aw-chip {
      font-size: 10px; padding: 2px 8px; border-radius: 99px;
      background: #f0f0f0; color: #555;
    }
  </style>
</head>

<body>

  <!-- ── page header ── -->
  <header style="background:#fff; border-bottom:1px solid #e8e8e8; padding:12px 14px 0;">
    <div style="max-width:900px; margin:0 auto;">
      <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;">
        <div>
          <span id="week-title" style="font-size:18px; font-weight:600; color:#111;">第 — 周</span>
          <span id="week-date"  style="font-size:11px; color:#999; margin-left:8px;"></span>
        </div>
        <span id="today-badge" style="font-size:11px; color:#888; background:#f2f2f2;
              border-radius:99px; padding:3px 10px;"></span>
      </div>
      <!-- week strip -->
      <div id="week-strip" style="display:flex; gap:5px; overflow-x:auto; padding-bottom:10px;"></div>
    </div>
  </header>

  <!-- 全周 courses banner -->
  <div id="allweek-bar"></div>

  <!-- ── timetable ── -->
  <div id="scroll-wrap">
    <div id="tt"></div>
  </div>

<script>
(function () {
  const TOTAL_WEEKS = 16;
  const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];

  const PERIODS = [
    { n:'01', t:'08:00', s:'上午' },
    { n:'02', t:'08:55', s:'' },
    { n:'03', t:'10:00', s:'' },
    { n:'04', t:'10:55', s:'' },
    { n:'05', t:'14:00', s:'下午' },
    { n:'06', t:'14:55', s:'' },
    { n:'07', t:'16:00', s:'' },
    { n:'08', t:'16:55', s:'' },
    { n:'09', t:'19:00', s:'晚上' },
    { n:'10', t:'19:55', s:'' },
    { n:'11', t:'20:50', s:'' },
    { n:'12', t:'21:35', s:'' },
    { n:'13', t:'22:20', s:'' },
  ];
  // period num → 0-based index
  const P_IDX = {};
  PERIODS.forEach((p, i) => P_IDX[p.n] = i);

  // section-break rows (0-based period index)
  const BREAK_IDX = new Set([0, 4, 8]);

  const PALETTE = [
    { bg:'#EEF2FF', border:'#818CF8', text:'#3730A3' }, // indigo
    { bg:'#ECFDF5', border:'#34D399', text:'#065F46' }, // emerald
    { bg:'#FFF7ED', border:'#FB923C', text:'#9A3412' }, // orange
    { bg:'#FDF4FF', border:'#C084FC', text:'#7E22CE' }, // purple
    { bg:'#F0F9FF', border:'#38BDF8', text:'#0C4A6E' }, // sky
    { bg:'#FFF1F2', border:'#FB7185', text:'#9F1239' }, // rose
    { bg:'#F7FEE7', border:'#86EFAC', text:'#166534' }, // green
    { bg:'#FFFBEB', border:'#FCD34D', text:'#92400E' }, // amber
  ];
  function courseColor(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
    return PALETTE[h % PALETTE.length];
  }

  // ── week strip ────────────────────────────────────────────────────────────
  function buildStrip(active) {
    const strip = document.getElementById('week-strip');
    strip.innerHTML = Array.from({length: TOTAL_WEEKS}, (_, i) => {
      const w = i + 1;
      return `<button class="week-btn${w===active?' active':''}"
                onclick="loadWeek(${w})" data-w="${w}">${w}</button>`;
    }).join('');
    setTimeout(() => {
      const b = strip.querySelector(`[data-w="${active}"]`);
      if (b) b.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    }, 40);
  }

  // ── timetable ─────────────────────────────────────────────────────────────
  function renderTT(courses, week, weekStart) {
    // update header labels
    document.getElementById('week-title').textContent = `第 ${week} 周`;
    const ws = new Date(weekStart + 'T00:00:00');
    const we = new Date(ws.getTime() + 6 * 86400000);
    document.getElementById('week-date').textContent =
      `${ws.getMonth()+1}/${ws.getDate()} – ${we.getMonth()+1}/${we.getDate()}`;

    // today info
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayDow = today.getDay() === 0 ? 6 : today.getDay() - 1; // 0=Mon
    const isThisWeek = today >= ws && today <= we;

    // split 全周 courses
    const allWeek = courses.filter(c => !c.day_num);
    const gridCourses = courses.filter(c => !!c.day_num);

    // render 全周 banner
    const bar = document.getElementById('allweek-bar');
    if (allWeek.length) {
      bar.style.display = 'flex';
      bar.innerHTML = '<span style="font-size:10px;color:#aaa;align-self:center;">全周</span>'
        + allWeek.map(c =>
            `<span class="aw-chip">${c.name}${c.classroom ? ' · ' + c.classroom : ''}</span>`
          ).join('');
    } else {
      bar.style.display = 'none';
    }

    let h = '';

    // corner
    h += `<div class="tt-corner" style="grid-column:1;grid-row:1;"></div>`;

    // day headers (row 1)
    DAYS.forEach((day, di) => {
      const col = di + 2;
      const isToday = isThisWeek && di === todayDow;
      const d = new Date(ws.getTime() + di * 86400000);
      const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
      h += `<div class="tt-day-hd${isToday?' today-hd':''}"
               style="grid-column:${col};grid-row:1;border-right:1px solid #e8e8e8;">
              <span class="hd-day"  style="font-size:11px;font-weight:600;color:${isToday?'#fff':'#111'};">${day}</span>
              <span class="hd-date" style="font-size:10px;color:${isToday?'rgba(255,255,255,.6)':'#bbb'};">${dateStr}</span>
            </div>`;
    });

    // time labels + background cells (rows 2…14)
    PERIODS.forEach((p, pi) => {
      const row = pi + 2;
      const brk = BREAK_IDX.has(pi) && pi > 0;
      const secLabel = p.s ? `<span style="font-size:8px;color:#ccc;margin-bottom:1px;">${p.s}</span>` : '';

      // time label (col 1)
      h += `<div class="tt-time${brk?' sec-break':''}"
               style="grid-column:1;grid-row:${row};">
              ${secLabel}
              <span style="font-size:10px;font-weight:500;color:#bbb;">${pi+1}</span>
              <span style="font-size:8px;color:#d0d0d0;">${p.t}</span>
            </div>`;

      // background cells (cols 2-8)
      DAYS.forEach((_, di) => {
        const col = di + 2;
        const isToday = isThisWeek && di === todayDow;
        h += `<div class="tt-cell${brk?' sec-break':''}"
                 style="grid-column:${col};grid-row:${row};${isToday?'background:#f0f5ff;':''}">
              </div>`;
      });
    });

    // course blocks
    gridCourses.forEach(c => {
      if (!c.periods || !c.periods.length) return;
      const col = c.day_num + 1; // 1-based day → col 2-8
      const sorted  = [...c.periods].sort();
      const pi0 = P_IDX[sorted[0]];
      const pi1 = P_IDX[sorted[sorted.length - 1]];
      if (pi0 === undefined || pi1 === undefined) return;

      const rowStart = pi0 + 2;
      const rowEnd   = pi1 + 3; // exclusive
      const span     = pi1 - pi0 + 1;

      const clr = courseColor(c.name);
      const teacher = (c.teacher || []).join('、');
      const parity  = c.parity === 'odd' ? '单周' : c.parity === 'even' ? '双周' : '';

      h += `<div class="course-blk"
               style="grid-column:${col};grid-row:${rowStart}/${rowEnd};
                      background:${clr.bg};border-left-color:${clr.border};color:${clr.text};">
              <div class="cn" style="-webkit-line-clamp:${span>2?4:2};display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;">
                ${c.name}</div>
              ${c.classroom ? `<div class="cr">${c.classroom}</div>` : ''}
              ${span > 2 && teacher ? `<div class="tc">${teacher}</div>` : ''}
              ${parity ? `<div class="pg">${parity}</div>` : ''}
            </div>`;
    });

    document.getElementById('tt').innerHTML = h;
  }

  // ── fetch ─────────────────────────────────────────────────────────────────
  async function loadWeek(w) {
    buildStrip(w);
    const res  = await fetch(`/api/week/${w}`);
    const data = await res.json();
    renderTT(data.courses, data.week, data.week_start);
  }

  async function init() {
    const res  = await fetch('/api/current');
    const data = await res.json();
    const d    = new Date(data.date + 'T00:00:00');
    const DOW  = ['日','一','二','三','四','五','六'];
    document.getElementById('today-badge').textContent =
      `今天 周${DOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
    buildStrip(data.week);
    renderTT(data.courses, data.week, data.week_start);
  }

  window.loadWeek = loadWeek;
  init();
})();
</script>
</body>
</html>
